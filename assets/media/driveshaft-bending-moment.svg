      <rect x="848" y="286" width="169" height="40" rx="5"/>
    </g>
    <g fill="#7b242b" font-size="26" font-weight="700" text-anchor="middle">
      <text x="425.344828" y="180">796 lbf·in</text>
      <text x="932.241379" y="315">549 lbf·in</text>
